version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Group all action bumps into one PR per run to cut noise.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      # "ci" keeps these out of the release-please changelog while staying
      # conventional-commit compliant.
      prefix: ci
    labels:
      - dependencies
